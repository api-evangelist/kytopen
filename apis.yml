aid: kytopen
name: Kytopen
description: >-
  Kytopen Corp. is a Cambridge, Massachusetts life-sciences instrument company, spun out of MIT,
  that builds non-viral, continuous-flow cellular engineering hardware for cell and gene therapy
  discovery and manufacturing. Its Flowfect technology combines continuous fluid flow with electric
  fields to deliver mRNA, DNA and CRISPR payloads into cells, and is sold as two benchtop platforms:
  Flowfect Discover, an automated small-volume system that runs up to 96 high-throughput
  transfections in about ten minutes, and Flowfect TX, a closed-system instrument that processes
  10-50 million cells per mL at 25-50 mL per minute for GMP-scale manufacturing. The company sells
  laboratory instruments and consumables to biopharma and CDMO customers through a quote and
  technology-access motion; it publishes no developer program, no public API, and no
  machine-readable API contract of any kind. Instrument data integration for Flowfect customers is
  delivered by a third party, Ganymede Bio, under its own platform and its own contract - that
  surface belongs to Ganymede, not to Kytopen.
